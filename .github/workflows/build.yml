name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: arc-runner-dema-rc
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config
      - name: Test RC input scaling
        run: |
          set -euxo pipefail
          mkdir -p build-tests
          cc -std=gnu11 -Wall -Wextra -Werror -Isrc tests/test_rc_scale.c -o build-tests/test_rc_scale
          ./build-tests/test_rc_scale
      - name: Compile native dema-rc
        run: |
          set -euxo pipefail
          meson setup build -Dboard=native
          meson compile -C build
          meson test -C build --print-errorlogs
          file build/src/dema-rc
          sha256sum build/src/dema-rc
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dema-rc-native-evidence
          path: |
            build/meson-logs/
            build/src/dema-rc
          if-no-files-found: warn
